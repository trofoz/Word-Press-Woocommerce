name: WooCommerce integration

on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:
    inputs:
      run_wayforpay_sandbox:
        description: 'Run one live WayForPay sandbox payment through an ephemeral, callback-only tunnel'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  integration:
    name: PHP 8.3 / WC 11.1 / ${{ matrix.checkout }} / HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        checkout: [classic, blocks]
        hpos: ['0', '1']

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress-test-only
          MARIADB_ROOT_PASSWORD: root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, mysqli, zip
          coverage: none

      - name: Install WP-CLI
        run: composer global require --no-interaction wp-cli/wp-cli-bundle:2.12.0

      - name: Install WordPress and WooCommerce into disposable database
        env:
          WP_PATH: ${{ runner.temp }}/wfpms-wp
          WP_CLI_ALLOW_ROOT: '1'
        run: |
          set -euo pipefail
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.0
          wp config create --path="$WP_PATH" \
            --dbname=wordpress_test --dbuser=wordpress --dbpass=wordpress-test-only \
            --dbhost=127.0.0.1 --dbprefix=wptest_ --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8099 \
            --title='Disposable WayForPay integration test' \
            --admin_user=test-admin --admin_password=test-only-admin-password \
            --admin_email=admin@example.test --skip-email
          wp config set WFPMS_MASTER_KEY "$(php -r 'echo bin2hex(random_bytes(32));')" --type=constant --path="$WP_PATH" >/dev/null
          wp config set WFPMS_MASTER_KEY_ID "integration-test" --type=constant --path="$WP_PATH" >/dev/null
          wp plugin install woocommerce --path="$WP_PATH" --version=11.1.0 --activate
          ln -s "$GITHUB_WORKSPACE" "$WP_PATH/wp-content/plugins/wayforpay-multi-seller"
          wp plugin activate wayforpay-multi-seller --path="$WP_PATH"
          UPSTREAM_PATH="$WP_PATH/../wayforpay-upstream"
          git init "$UPSTREAM_PATH"
          git -C "$UPSTREAM_PATH" remote add origin https://github.com/wayforpay/Word-Press-Woocommerce.git
          git -C "$UPSTREAM_PATH" fetch --depth=1 origin b33c8bcb725cf02f8a546273596071024fa4a7ba
          git -C "$UPSTREAM_PATH" checkout --detach FETCH_HEAD
          ln -s "$UPSTREAM_PATH" "$WP_PATH/wp-content/plugins/wayforpay-upstream"
          wp plugin activate wayforpay-upstream --path="$WP_PATH"
          if [[ '${{ matrix.hpos }}' == 1 ]]; then
            wp wc hpos enable --with-sync --path="$WP_PATH"
          fi
          if [[ '${{ matrix.checkout }}' == blocks ]]; then
            wp post create --path="$WP_PATH" --post_type=page --post_title=Checkout \
              --post_name=checkout --post_status=publish \
              --post_content='<!-- wp:woocommerce/checkout /-->' --porcelain > "$RUNNER_TEMP/checkout-page-id"
          else
            wp post create --path="$WP_PATH" --post_type=page --post_title=Checkout \
              --post_name=checkout --post_status=publish \
              --post_content='[woocommerce_checkout]' --porcelain > "$RUNNER_TEMP/checkout-page-id"
          fi
          wp option update woocommerce_checkout_page_id "$(cat "$RUNNER_TEMP/checkout-page-id")" --path="$WP_PATH"
          wp post create --path="$WP_PATH" --post_type=page --post_title='Classic checkout integration' \
            --post_name=classic-checkout-test --post_status=publish \
            --post_content='[woocommerce_checkout]' --porcelain > "$RUNNER_TEMP/classic-checkout-page-id"
          wp server --host=127.0.0.1 --port=8099 --path="$WP_PATH" > "$RUNNER_TEMP/wp-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8099/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8099/ >/dev/null || { cat "$RUNNER_TEMP/wp-server.log"; exit 1; }
          WFPMS_EXPECT_HPOS='${{ matrix.hpos }}' WFPMS_CHECKOUT='${{ matrix.checkout }}' \
            wp eval-file "$GITHUB_WORKSPACE/tests/integration-runtime.php" --path="$WP_PATH"
          WFPMS_BASE_URL=http://127.0.0.1:8099 \
          WFPMS_PRODUCT_SELLER_ONE="$(wp option get wfpms_integration_iban_product_id --path="$WP_PATH")" \
          WFPMS_PRODUCT_SELLER_ONE_SECOND="$(wp option get wfpms_integration_same_seller_product_2_id --path="$WP_PATH")" \
          WFPMS_PRODUCT_SELLER_TWO="$(wp option get wfpms_integration_manual_product_id --path="$WP_PATH")" \
            python3 "$GITHUB_WORKSPACE/tests/integration-http-cart.py"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-cart.php" --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-legacy-migration.php" --path="$WP_PATH"
          callback_status="$(curl --silent --output "$RUNNER_TEMP/legacy-callback-body" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            'http://127.0.0.1:8099/?wc-api=WC_wayforpay')"
          [[ "$callback_status" == 400 ]] || { echo "Legacy callback ownership check returned HTTP $callback_status"; exit 1; }
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-order-pay.php" --path="$WP_PATH"
          WFPMS_EXPECT_HPOS='${{ matrix.hpos }}' wp eval-file \
            "$GITHUB_WORKSPACE/tests/integration-admin-fixtures.php" --path="$WP_PATH"
          WFPMS_BASE_URL=http://127.0.0.1:8099 \
          WFPMS_ADMIN_USER=test-admin \
          WFPMS_ADMIN_PASSWORD=test-only-admin-password \
          WFPMS_EXPECT_HPOS='${{ matrix.hpos }}' \
          WFPMS_SELLER_ONE_ID="$(wp option get wfpms_integration_seller_one_id --path="$WP_PATH")" \
          WFPMS_SELLER_TWO_ID="$(wp option get wfpms_integration_seller_two_id --path="$WP_PATH")" \
          WFPMS_ORDER_SELLER_ONE="$(wp option get wfpms_integration_admin_order_seller_1 --path="$WP_PATH")" \
          WFPMS_ORDER_SELLER_TWO="$(wp option get wfpms_integration_admin_order_seller_2 --path="$WP_PATH")" \
          WFPMS_UNASSIGNED_PRODUCT="$(wp option get wfpms_integration_unassigned_product_id --path="$WP_PATH")" \
          WFPMS_CONFLICTED_PRODUCT="$(wp option get wfpms_integration_conflicted_product_id --path="$WP_PATH")" \
          WFPMS_PRODUCT_SELLER_ONE="$(wp option get wfpms_integration_iban_product_id --path="$WP_PATH")" \
            python3 "$GITHUB_WORKSPACE/tests/integration-http-admin.py"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-wayforpay-callback.php" --path="$WP_PATH"
          for receipt_case in accepted duplicate conflict; do
            WFPMS_BANK_RECEIPT_CASE="$receipt_case" \
              wp eval-file "$GITHUB_WORKSPACE/tests/integration-bank-receipt.php" --path="$WP_PATH"
          done
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-expired-payment-form.php" --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-schema-upgrade.php" --path="$WP_PATH"
          WFPMS_BASE_URL=http://127.0.0.1:8099 \
          WFPMS_PRODUCT_ID="$(wp option get wfpms_integration_iban_product_id --path="$WP_PATH")" \
          WFPMS_CLASSIC_CHECKOUT_PATH="/?page_id=$(cat "$RUNNER_TEMP/classic-checkout-page-id")" \
          WFPMS_HTTP_ORDER_IDS_PATH="$RUNNER_TEMP/http-checkout-order-ids.json" \
            python3 "$GITHUB_WORKSPACE/tests/integration-http-checkout.py"
          WFPMS_HTTP_ORDER_IDS_PATH="$RUNNER_TEMP/http-checkout-order-ids.json" \
          WFPMS_HTTP_ORDER_PAY_PATHS_PATH="$RUNNER_TEMP/http-order-pay-paths.json" \
            wp eval-file "$GITHUB_WORKSPACE/tests/integration-http-checkout-assert.php" --path="$WP_PATH"
          WFPMS_HTTP_ORDER_PAY_PATHS_PATH="$RUNNER_TEMP/http-order-pay-paths.json" \
          WFPMS_BASE_URL=http://127.0.0.1:8099 \
          WFPMS_ADMIN_USER=test-admin \
          WFPMS_ADMIN_PASSWORD=test-only-admin-password \
            python3 "$GITHUB_WORKSPACE/tests/integration-http-order-pay.py"
          wp plugin deactivate wayforpay-multi-seller wayforpay-upstream --path="$WP_PATH"
          wp plugin activate wayforpay-upstream --path="$WP_PATH"
          wp plugin activate wayforpay-multi-seller --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-plugin-order.php" --path="$WP_PATH"
          callback_status="$(curl --silent --output "$RUNNER_TEMP/reversed-legacy-callback-body" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            'http://127.0.0.1:8099/?wc-api=WC_wayforpay')"
          [[ "$callback_status" == 400 ]] || { echo "Reverse-order legacy callback ownership check returned HTTP $callback_status"; exit 1; }

  wayforpay-sandbox:
    name: WayForPay sandbox hosted-payment status
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_wayforpay_sandbox) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-wfp-sandbox]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress-test-only
          MARIADB_ROOT_PASSWORD: root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, mysqli, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install disposable WordPress and WooCommerce
        env:
          WP_PATH: ${{ runner.temp }}/wfpms-sandbox-wp
          WP_CLI_ALLOW_ROOT: '1'
        run: |
          set -euo pipefail
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          composer global require --no-interaction wp-cli/wp-cli-bundle:2.12.0
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.0
          wp config create --path="$WP_PATH" \
            --dbname=wordpress_test --dbuser=wordpress --dbpass=wordpress-test-only \
            --dbhost=127.0.0.1 --dbprefix=wfsandbox_ --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8099 \
            --title='Disposable WayForPay sandbox' \
            --admin_user=sandbox-admin --admin_password=sandbox-only-password \
            --admin_email=sandbox@example.test --skip-email
          wp plugin install woocommerce --path="$WP_PATH" --version=11.1.0 --activate
          ln -s "$GITHUB_WORKSPACE" "$WP_PATH/wp-content/plugins/wayforpay-multi-seller"
          # Keep this encryption key unique to the disposable runner and out of logs/artifacts.
          wp config set WFPMS_MASTER_KEY "$(php -r 'echo bin2hex(random_bytes(32));')" --type=constant --path="$WP_PATH" >/dev/null
          wp config set WFPMS_MASTER_KEY_ID "sandbox-run" --type=constant --path="$WP_PATH" >/dev/null
          wp plugin activate wayforpay-multi-seller --path="$WP_PATH"
          cat > "$RUNNER_TEMP/wp-router.php" <<'PHP'
          <?php
          if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
              $_SERVER['HTTPS'] = 'on';
              $_SERVER['SERVER_PORT'] = '443';
          }
          $root = getenv('WFPMS_WP_PATH');
          $path = parse_url($_SERVER['REQUEST_URI'] ?? '/', PHP_URL_PATH);
          if (is_string($root) && $path !== false && $path !== '/' && is_file($root . $path)) {
              return false;
          }
          require $root . '/index.php';
          PHP
          # The runner exposes only the PHP server through a separate allowlisted proxy.
          WFPMS_WP_PATH="$WP_PATH" php -S 127.0.0.1:8099 -t "$WP_PATH" "$RUNNER_TEMP/wp-router.php" >/dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/php-server.pid"

      - name: Install Cloudflare Tunnel and start callback-only proxy
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo gpg --dearmor --yes -o /usr/share/keyrings/cloudflare-main.gpg
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y cloudflared
          WFPMS_SANDBOX_OUTPUT="$RUNNER_TEMP/wfpms-sandbox-payment.json" \
          WFPMS_SANDBOX_METRICS="$RUNNER_TEMP/wfpms-sandbox-metrics.json" \
            python3 "$GITHUB_WORKSPACE/tests/wayforpay-sandbox-proxy.py" >/dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/proxy.pid"
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8098 >"$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cloudflared.pid"
          for attempt in $(seq 1 60); do
            TUNNEL_URL="$(sed -nE 's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' "$RUNNER_TEMP/cloudflared.log" | head -n1)"
            if [[ -n "$TUNNEL_URL" ]]; then
              rm -f "$RUNNER_TEMP/cloudflared.log"
              break
            fi
            sleep 2
          done
          if [[ -z "${TUNNEL_URL:-}" ]]; then
            echo 'Cloudflare Quick Tunnel did not start.'
            exit 1
          fi
          echo "::add-mask::$TUNNEL_URL"
          echo "WFPMS_TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8098/__health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Callback-only proxy did not become healthy.'
          exit 1

      - name: Seed one sandbox order using the published WayForPay test merchant
        env:
          WP_PATH: ${{ runner.temp }}/wfpms-sandbox-wp
          WP_CLI_ALLOW_ROOT: '1'
          WFPMS_SANDBOX_OUTPUT: ${{ runner.temp }}/wfpms-sandbox-payment.json
        run: |
          set -euo pipefail
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          merchant_secret="$(python3 - <<'PY'
          import html, re, urllib.request
          page = urllib.request.urlopen('https://wiki.wayforpay.com/view/852472', timeout=20).read().decode('utf-8', 'replace')
          text = html.unescape(re.sub(r'<[^>]+>', ' ', page))
          match = re.search(r'merchantSecretKey\s*[-–:]\s*([^\s<]+)', text)
          if not match:
              raise SystemExit('Could not read the published sandbox credential from WayForPay docs.')
          print(match.group(1))
          PY
          )"
          echo "::add-mask::$merchant_secret"
          WFPMS_SANDBOX_SECRET="$merchant_secret" WFPMS_TUNNEL_URL="$WFPMS_TUNNEL_URL" \
            wp eval-file "$GITHUB_WORKSPACE/tests/wayforpay-sandbox-seed.php" --path="$WP_PATH" >/dev/null
          unset merchant_secret

      - name: Install the headless browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Submit the published WayForPay sandbox test card
        env:
          WFPMS_SANDBOX_INPUT: ${{ runner.temp }}/wfpms-sandbox-payment.json
        run: node tests/wayforpay-sandbox-browser.mjs

      - name: Verify signed WayForPay status and WooCommerce order outcome
        env:
          WP_PATH: ${{ runner.temp }}/wfpms-sandbox-wp
          WP_CLI_ALLOW_ROOT: '1'
          WFPMS_SANDBOX_INPUT: ${{ runner.temp }}/wfpms-sandbox-payment.json
          WFPMS_SANDBOX_METRICS: ${{ runner.temp }}/wfpms-sandbox-metrics.json
        run: |
          set -euo pipefail
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/wayforpay-sandbox-verify.php" --path="$WP_PATH"

      - name: Stop ephemeral tunnel and local services
        if: always()
        run: |
          for name in cloudflared proxy php-server; do
            pid_file="$RUNNER_TEMP/$name.pid"
            if [[ -f "$pid_file" ]]; then kill "$(cat "$pid_file")" 2>/dev/null || true; fi
          done

