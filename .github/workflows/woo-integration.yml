name: WooCommerce integration

on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:
    inputs:
      run_wayforpay_sandbox:
        description: 'Run one live WayForPay sandbox payment through an ephemeral, callback-only tunnel'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  integration:
    name: PHP 8.3 / WC 11.1 / ${{ matrix.checkout }} / HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        checkout: [classic, blocks]
        hpos: ['0', '1']

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress-test-only
          MARIADB_ROOT_PASSWORD: root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, mysqli, zip
          coverage: none

      - name: Install WP-CLI
        run: composer global require --no-interaction wp-cli/wp-cli-bundle:2.12.0

      - name: Install WordPress and WooCommerce into disposable database
        env:
          WP_PATH: ${{ runner.temp }}/wfpms-wp
          WP_CLI_ALLOW_ROOT: '1'
        run: |
          set -euo pipefail
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.0
          wp config create --path="$WP_PATH" \
            --dbname=wordpress_test --dbuser=wordpress --dbpass=wordpress-test-only \
            --dbhost=127.0.0.1 --dbprefix=wptest_ --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8099 \
            --title='Disposable WayForPay integration test' \
            --admin_user=test-admin --admin_password=test-only-admin-password \
            --admin_email=admin@example.test --skip-email
          wp plugin install woocommerce --path="$WP_PATH" --version=11.1.0 --activate
          ln -s "$GITHUB_WORKSPACE" "$WP_PATH/wp-content/plugins/wayforpay-multi-seller"
          wp plugin activate wayforpay-multi-seller --path="$WP_PATH"
          if [[ '${{ matrix.hpos }}' == 1 ]]; then
            wp wc hpos enable --with-sync --path="$WP_PATH"
          fi
          if [[ '${{ matrix.checkout }}' == blocks ]]; then
            wp post create --path="$WP_PATH" --post_type=page --post_title=Checkout \
              --post_name=checkout --post_status=publish \
              --post_content='<!-- wp:woocommerce/checkout /-->' --porcelain > "$RUNNER_TEMP/checkout-page-id"
          else
            wp post create --path="$WP_PATH" --post_type=page --post_title=Checkout \
              --post_name=checkout --post_status=publish \
              --post_content='[woocommerce_checkout]' --porcelain > "$RUNNER_TEMP/checkout-page-id"
          fi
          wp option update woocommerce_checkout_page_id "$(cat "$RUNNER_TEMP/checkout-page-id")" --path="$WP_PATH"
          WFPMS_EXPECT_HPOS='${{ matrix.hpos }}' WFPMS_CHECKOUT='${{ matrix.checkout }}' \
            wp eval-file "$GITHUB_WORKSPACE/tests/integration-runtime.php" --path="$WP_PATH"
          for receipt_case in accepted duplicate conflict; do
            WFPMS_BANK_RECEIPT_CASE="$receipt_case" \
              wp eval-file "$GITHUB_WORKSPACE/tests/integration-bank-receipt.php" --path="$WP_PATH"
          done
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-expired-payment-form.php" --path="$WP_PATH"

  wayforpay-sandbox:
    name: WayForPay sandbox hosted-payment status
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_way…871 tokens truncated…mor --yes -o /usr/share/keyrings/cloudflare-main.gpg
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y cloudflared
          WFPMS_SANDBOX_OUTPUT="$RUNNER_TEMP/wfpms-sandbox-payment.json" \
          WFPMS_SANDBOX_METRICS="$RUNNER_TEMP/wfpms-sandbox-metrics.json" \
            python3 "$GITHUB_WORKSPACE/tests/wayforpay-sandbox-proxy.py" >/dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/proxy.pid"
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8098 >"$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cloudflared.pid"
          for attempt in $(seq 1 60); do
            TUNNEL_URL="$(sed -nE 's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' "$RUNNER_TEMP/cloudflared.log" | head -n1)"
            if [[ -n "$TUNNEL_URL" ]]; then
              rm -f "$RUNNER_TEMP/cloudflared.log"
              break
            fi
            sleep 2
          done
          if [[ -z "${TUNNEL_URL:-}" ]]; then
            echo 'Cloudflare Quick Tunnel did not start.'
            exit 1
          fi
          echo "::add-mask::$TUNNEL_URL"
          echo "WFPMS_TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8098/__health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Callback-only proxy did not become healthy.'
          exit 1

      - name: Seed one sandbox order using the published WayForPay test merchant
        env:
          WP_PATH: ${{ runner.temp }}/wfpms-sandbox-wp
          WP_CLI_ALLOW_ROOT: '1'
          WFPMS_SANDBOX_OUTPUT: ${{ runner.temp }}/wfpms-sandbox-payment.json
        run: |
          set -euo pipefail
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          merchant_secret="$(python3 - <<'PY'
          import html, re, urllib.request
          page = urllib.request.urlopen('https://wiki.wayforpay.com/view/852472', timeout=20).read().decode('utf-8', 'replace')
          text = html.unescape(re.sub(r'<[^>]+>', ' ', page))
          match = re.search(r'merchantSecretKey\s*[-–:]\s*([^\s<]+)', text)
          if not match:
              raise SystemExit('Could not read the published sandbox credential from WayForPay docs.')
          print(match.group(1))
          PY
          )"
          echo "::add-mask::$merchant_secret"
          WFPMS_SANDBOX_SECRET="$merchant_secret" WFPMS_TUNNEL_URL="$WFPMS_TUNNEL_URL" \
            wp eval-file "$GITHUB_WORKSPACE/tests/wayforpay-sandbox-seed.php" --path="$WP_PATH" >/dev/null
          unset merchant_secret

      - name: Install the headless browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Submit the published WayForPay sandbox test card
        env:
          WFPMS_SANDBOX_INPUT: ${{ runner.temp }}/wfpms-sandbox-payment.json
        run: node tests/wayforpay-sandbox-browser.mjs

      - name: Verify signed WayForPay status and WooCommerce order outcome
        env:
          WP_PATH: ${{ runner.temp }}/wfpms-sandbox-wp
          WP_CLI_ALLOW_ROOT: '1'
          WFPMS_SANDBOX_INPUT: ${{ runner.temp }}/wfpms-sandbox-payment.json
          WFPMS_SANDBOX_METRICS: ${{ runner.temp }}/wfpms-sandbox-metrics.json
        run: |
          set -euo pipefail
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/wayforpay-sandbox-verify.php" --path="$WP_PATH"

      - name: Stop ephemeral tunnel and local services
        if: always()
        run: |
          for name in cloudflared proxy php-server; do
            pid_file="$RUNNER_TEMP/$name.pid"
            if [[ -f "$pid_file" ]]; then kill "$(cat "$pid_file")" 2>/dev/null || true; fi
          done

